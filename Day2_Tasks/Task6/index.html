<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DOM Manipulation</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ---------- Heading ---------- -->

    <h1>DOM Manipulation Using JavaScript</h1>

    <!-- ---------- Form ---------- -->

    <form id="myForm">
      <!-- Name -->

      <label for="name">Name:</label>
      <br />

      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
        required
      />

      <br /><br />

      <!-- Father Name -->

      <label for="fatherName">Father Name:</label>
      <br />

      <input
        type="text"
        id="fatherName"
        name="fatherName"
        placeholder="Enter your father's name"
        required
      />

      <br /><br />

      <!-- Age -->

      <label for="age">Age:</label>
      <br />

      <input
        type="number"
        id="age"
        name="age"
        placeholder="Enter Your Age"
        required
      />

      <br /><br />

      <!-- Gender -->

      <label for="gender">Gender:</label>
      <br />

      <select id="gender" name="gender" required>
        <option value="">Select Gender</option>

        <option value="Male">Male</option>

        <option value="Female">Female</option>
      </select>

      <br /><br />

      <!-- Status -->

      <div class="status-group">
        <label>Status:</label>

        <div class="status-options">
          <!-- Passed -->

          <label>
            <input
              type="radio"
              id="passed"
              name="status"
              value="Passed"
              required
            />

            Passed
          </label>

          <!-- Failed -->

          <label>
            <input type="radio" id="failed" name="status" value="Failed" />

            Failed
          </label>
        </div>
      </div>

      <!-- Submit Button -->

      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <br /><br />

    <!-- ---------- Table ---------- -->

    <table id="myTable">
      <!-- Table Header -->

      <thead id="myHead">
        <tr>
          <th>Name</th>
          <th>Father Name</th>
          <th>Age</th>
          <th>Gender</th>
          <th>Status</th>
        </tr>
      </thead>

      <!-- Table Body -->

      <tbody id="myBody">
        <!-- JavaScript will add data here -->
      </tbody>
    </table>

    <!-- ---------- JavaScript ---------- -->

    <script src="index.js"></script>
  </body>
</html>
